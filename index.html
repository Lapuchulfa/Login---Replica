<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AdminExpress</title>
  <link rel="stylesheet" href="CSS/style.css">
</head>
<body>

  <main class="contenedor">

    <div class="lado-azul">
      <h2>AdminExpress</h2>
    </div>

    <div class="lado-blanco">
      <form class="formulario">

        <h1>Let's <b>Sign In</b> </h1>
        <p class="texto-gris">Hey, Enter your details to get sign in to your account.</p>

        <label for="email">Email</label>
        <div class="campo">
          
          <input type="email" id="email" placeholder="Enter Email">
        </div>

        <label for="password">Password</label>
        <div class="campo">
          
          <input type="password" id="password" placeholder="Enter Password">
          
        </div>

        <a href="#" class="olvido">Forgot password?</a>

        <button type="submit">Sign In</button>

        <p class="registro">Don't have an account? <a href="#">Sign Up</a></p>

      </form>
    </div>

  </main>

</body>
</html>
